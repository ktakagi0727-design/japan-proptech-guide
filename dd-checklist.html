<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>不動産DDチェックリスト生成ツール | 不動産売買の無料便利ツール</title>
    <meta name="description" content="物件タイプと検討フェーズを選ぶだけで、取得検討・仲介調査・売却資料準備に使える不動産DDチェックリストを生成できる無料ツールです。">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta property="og:title" content="不動産DDチェックリスト生成ツール">
    <meta property="og:description" content="物件タイプと検討フェーズに応じて、不動産DDの確認項目を整理できます。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/proptech-hero.png">
    <meta property="og:url" content="https://japan-proptech-guide.netlify.app/dd-checklist.html">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://japan-proptech-guide.netlify.app/dd-checklist.html">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="tools-page">
    <header class="site-header scrolled" data-header>
      <a class="brand" href="index.html" aria-label="不動産売買向けプロップテックサービスガイド">
        <span class="brand-mark">RE</span>
        <span>売買PropTech Guide</span>
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="index.html#services">業務プロセス</a>
        <a href="tools.html" aria-current="page">便利ツール</a>
        <a href="index.html#cases">導入事例</a>
        <a href="index.html#news">ニュース</a>
        <a href="index.html#contact">問合せ</a>
      </nav>
    </header>

    <main class="tools-main">
      <section id="dd-tool" class="section tool-section">
        <div class="section-heading row">
          <div>
            <p class="eyebrow">Tool 03</p>
            <h1>不動産DDチェックリスト生成ツール</h1>
          </div>
          <p class="section-note">取得検討、仲介調査、売却資料準備で確認したい項目を、物件タイプに合わせて生成します。</p>
        </div>
        <div class="tool-layout">
          <form class="tool-panel" data-dd-form>
            <label>
              <span>物件タイプ</span>
              <select data-dd-type>
                <option value="office">オフィス・商業ビル</option>
                <option value="residence">賃貸住宅</option>
                <option value="land">土地・開発用地</option>
                <option value="hotel">ホテル・宿泊施設</option>
              </select>
            </label>
            <label>
              <span>検討フェーズ</span>
              <select data-dd-phase>
                <option value="initial">初期検討</option>
                <option value="loi">買付・LOI前</option>
                <option value="full">詳細DD</option>
              </select>
            </label>
            <label class="checkbox-line">
              <input type="checkbox" data-dd-income checked>
              <span>収益物件として検討する</span>
            </label>
            <label class="checkbox-line">
              <input type="checkbox" data-dd-development>
              <span>建替・開発余地も確認する</span>
            </label>
            <div class="tool-actions">
              <button class="primary-action form-submit" type="button" data-copy-dd>チェックリストをコピー</button>
              <button class="more-button" type="button" data-print-dd>印刷/PDF保存</button>
            </div>
          </form>
          <div class="checklist-panel" data-dd-result></div>
        </div>
      </section>
    </main>

    <div class="print-output" data-print-output aria-hidden="true"></div>

    <footer class="footer">
      <p>不動産売買向けプロップテックサービスガイド</p>
      <p>各ツールは概算・初期検討用です。契約、税務、法務、建築判断は専門家に確認してください。</p>
    </footer>

    <script src="tools.js"></script>
  </body>
</html>
